<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小編萬聖夜">
<meta name="theme-color" content="#101722">
<title>小編萬聖夜｜山頂國小</title>
<link rel="icon" href="icon-192.png?v=4">
<link rel="apple-touch-icon" href="icon-180.png?v=4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui">

  <!-- 遊戲中 -->
  <div id="hud" class="hide">
    <div class="xp"><b id="lvN">Lv 1</b><i><em id="xpBar"></em></i></div>
    <div class="h1">
      <button class="ib" id="bPause" aria-label="暫停"><svg viewBox="0 0 40 40"><path d="M14 10 V30 M26 10 V30"/></svg></button>
      <div class="slots" id="slots"></div>
      <div class="stat"><span id="clock">0:00</span><small id="kills">擊倒 0</small></div>
    </div>
  </div>
  <div id="wait" class="hide"><p id="waitText"></p><i><em id="waitBar"></em></i></div>
  <div id="tip" class="hide"><p id="tipText"></p></div>

  <!-- 升級三選一 -->
  <div id="cards" class="hide">
    <h3 id="cardsTitle">升級！選一個</h3>
    <div class="row" id="cardRow"></div>
  </div>

  <!-- 劇情對話 -->
  <div id="talk" class="hide">
    <div class="who" id="talkWho"></div>
    <p id="talkText"></p>
    <span class="more">點一下繼續</span>
    <button class="skip" id="talkSkip">跳過</button>
  </div>

  <!-- 暫停 -->
  <div id="pause" class="hide">
    <div class="panel board">
      <h2>暫停</h2>
      <div class="have" id="haveList"></div>
      <button class="btn" id="pResume">繼續</button>
      <button class="btn" id="pRetry">重新開始這關</button>
      <button class="btn" id="pMenu">回選單</button>
      <button class="btn small" id="pMute">聲音：開</button>
    </div>
  </div>

  <!-- 結算 -->
  <div id="result" class="hide">
    <div class="rh"><span>聯絡簿</span><em id="rDate"></em></div>
    <h2 id="rTitle">過關！</h2>
    <ul id="rStats"></ul>
    <p id="rLine"></p>
    <div class="row">
      <button class="btn ghost" id="rMenu">選單</button>
      <button class="btn" id="rNext">下一關</button>
    </div>
  </div>

  <!-- 標題 -->
  <div id="title" class="screen hide">
    <div class="school">山頂國小</div>
    <h1><img class="logo" src="art/logo.webp?v=4" alt="小編萬聖夜"></h1>
    <p class="sub">萬聖節晚會前，南瓜仔佔領了校舍</p>
    <div class="t-btns">
      <button class="btn big hide" id="bContinue">繼續</button>
      <button class="btn big" id="bStart">開始</button>
      <button class="btn ghost" id="bSelect">選關</button>
    </div>
    <p class="how">拖曳畫面走路・碰到梯子往上推就爬・攻擊全自動</p>
    <button class="op-again" id="bOP">再看一次片頭</button>
    <p class="iosTip hide" id="iosTip">iPhone：Safari 按「分享 → 加入主畫面」，從主畫面打開就是全螢幕</p>
  </div>

  <!-- 選關 -->
  <div id="select" class="screen hide">
    <div class="sel-head"><button class="tag" id="bBack">返回</button><h2>選關</h2></div>
    <p class="sel-sub">每一關都可以直接玩；打到一半離開會自動存檔，標題畫面按「繼續」接著玩</p>
    <div id="levels"></div>
  </div>

  <!-- 片頭 -->
  <div id="op" class="screen hide">
    <p class="op-line" id="opLine">山頂國小・萬聖節的晚上</p>
    <h1><img class="logo" id="opLogo" src="art/logo.webp?v=4" alt="小編萬聖夜"></h1>
    <p class="op-sub" id="opSub">南瓜仔佔領了校舍！</p>
    <button class="op-skip" id="opSkip">跳過</button>
  </div>

  <!-- 載入 -->
  <div id="loading" class="screen">
    <div class="ld"><b>小編萬聖夜</b><i><em id="ldBar"></em></i><span id="ldText">南瓜燈點起來中…</span>
      <button class="btn big hide" id="bEnter">點一下開始</button><span class="ld-note hide" id="ldNote">有配樂，記得開聲音</span></div>
  </div>
</div>

<script src="js/data.js?v=4"></script>
<script src="js/core.js?v=4"></script>
<script src="js/audio.js?v=4"></script>
<script>
  if (!(window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports('importmap'))) {
    const sc = document.createElement('script'); sc.async = true; sc.src = 'vendor/es-module-shims.js'; document.head.appendChild(sc);
  }
</script>
<script type="importmap">
{"imports":{"three":"./vendor/three/build/three.module.min.js","three/addons/":"./vendor/three/examples/jsm/"}}
</script>
<script type="module" src="js/main.js?v=4"></script>
</body>
</html>
